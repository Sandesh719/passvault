appId: org.passvault.desktop
productName: PassVault
copyright: PassVault

directories:
  output: release
  buildResources: build

# The workspace packages are compiled into out/main/index.js, so the only thing
# that has to be collected from node_modules is the six real dependencies.
files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/*.ts"

# node-sqlite3-wasm loads a .wasm file from its own directory at runtime, and a
# file inside the asar archive has no path on disk to load. Unpacking it is the
# difference between the app opening its database and failing on first launch.
asarUnpack:
  - node_modules/node-sqlite3-wasm/**

# One 1024x1024 PNG; electron-builder renders the .icns and .ico from it.
# Named explicitly so that losing the file fails the build rather than quietly
# shipping the default Electron icon, which is what happened before.
icon: build/icon.png

mac:
  category: public.app-category.utilities
  # A .dmg only. electron-builder also offers a zipped .app, but that target
  # exists to feed auto-updates — electron-updater cannot read a dmg. With no
  # updater wired up it is a second copy of the same app on the release page,
  # twice the download size and one more thing to choose between. Add `zip`
  # back the day auto-update arrives.
  target:
    - target: dmg
      arch: [arm64, x64]
  # The app reaches a signaling server and opens WebRTC connections; on a
  # hardened runtime, outgoing network access has to be declared.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc, not unsigned.
  #
  # `identity: null` skipped signing altogether, which left Electron's own
  # linker signature inside a bundle that had since been renamed and had
  # resources added. The result verifies as broken — `code has no resources but
  # signature indicates they must be present` — and macOS reports a broken
  # signature as "the app is damaged", which sends you looking for a corrupt
  # download that does not exist.
  #
  # "-" re-signs the whole bundle with an ad-hoc identity: no certificate, no
  # Apple involvement, but internally consistent. Still not distributable — see
  # DEPLOY.md for Developer ID — and it runs cleanly on the machine that built
  # it.
  identity: "-"

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # The vault file lives wherever KeePassXC keeps it, and the device key lives
  # in the user's app data. Neither belongs to the installer.
  deleteAppDataOnUninstall: false

linux:
  # Both, because they fail in different places.
  #
  # An AppImage runs on any distribution without being installed, which is the
  # whole appeal — but from Ubuntu 23.10 AppArmor refuses unprivileged user
  # namespaces, and Electron's sandbox needs them. Those users get an app that
  # will not start unless they pass --no-sandbox.
  #
  # A .deb is installed properly: dpkg sets chrome-sandbox setuid root, so the
  # sandbox works without being disabled, the app appears in the applications
  # menu, and apt can remove it again. That is the one to point Ubuntu users at.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  # Without this the binary is named after the npm package — `@passvaultdesktop`,
  # scope punctuation and all — which is what a person would have to type to
  # launch it, and what the .deb would be called.
  executableName: passvault
  synopsis: Keep one KeePass vault in step across your devices
  description:
    PassVault synchronises a KeePass .kdbx file between your own devices over a
    direct peer-to-peer connection. KeePassXC still manages your passwords; this
    moves the file, and it stays encrypted the whole way.

deb:
  artifactName: ${productName}-${version}.${ext}
  # Electron's safeStorage reaches libsecret to protect this device's private
  # key. Without it the app still runs, but stores the key in the clear and
  # says so — better to let apt pull it in.
  depends:
    - libsecret-1-0
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libdrm2
    - libgbm1
    - libxcb-dri3-0

appImage:
  artifactName: ${productName}-${version}.${ext}

