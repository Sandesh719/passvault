name: Release

# Each installer is built on the operating system it targets.
#
# A Windows installer can in principle be produced from macOS through wine, but
# the result is unverifiable on the machine that made it: nothing there can run
# it. A Windows runner builds it and can smoke-test it, which is the difference
# between shipping an installer and hoping.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The release job creates a GitHub Release and uploads to it.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # The end-to-end path through real KDBX files, so a release cannot ship
      # with the stack broken below the interface.
      - run: pnpm demo

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: package:mac
          - os: windows-latest
            target: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @passvault/desktop ${{ matrix.target }}
        env:
          # Without a token electron-builder tries to publish on a tag push.
          GH_TOKEN: ""
          # Signing is off until there are certificates to sign with; see
          # DEPLOY.md. These stop electron-builder from looking for them.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Does the packaged app actually start?
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # A build that produces an installer but an app that dies on launch is
          # the failure this catches — most often a dependency that resolved on
          # the build machine and not inside the package.
          $exe = Get-ChildItem -Recurse -Filter PassVault.exe `
            -Path apps/desktop/release/win-unpacked | Select-Object -First 1
          if (-not $exe) { throw "no PassVault.exe was produced" }
          $profile = Join-Path $env:RUNNER_TEMP "passvault-smoke"
          $proc = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--user-data-dir=$profile" -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) { throw "the app exited with $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          # Proof it got far enough to open its own store, rather than merely
          # showing a window before failing.
          if (-not (Test-Path (Join-Path $profile "metadata.db"))) {
            throw "the app never created its database"
          }
          Write-Host "started, created its database, and stayed up"

      - uses: actions/upload-artifact@v4
        with:
          name: passvault-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Capacitor's own modules compile against 21; the build declares a
      # toolchain, but the runner still needs a JDK that satisfies it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @passvault/mobile check
      - run: pnpm --filter @passvault/mobile build

      - name: Restore the signing key
        # Absent on a fork or before the secrets are set. The build then
        # produces an unsigned APK, which the publish step refuses to ship
        # rather than handing anyone something that cannot be installed.
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > apps/mobile/android/passvault.jks

      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          PASSVAULT_KEYSTORE: passvault.jks
          PASSVAULT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASSVAULT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSVAULT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap sync android
          # Unset the keystore variable entirely when no key was restored, so
          # the config leaves the build unsigned rather than pointing at a
          # file that is not there.
          if [ ! -f passvault.jks ]; then unset PASSVAULT_KEYSTORE; fi
          ./gradlew assembleRelease

      - name: Name it after the release
        run: |
          mkdir -p artifacts
          built=apps/mobile/android/app/build/outputs/apk/release
          if [ -f "$built/app-release.apk" ]; then
            cp "$built/app-release.apk" "artifacts/PassVault-${GITHUB_REF_NAME#v}.apk"
          else
            # An unsigned build leaves app-release-unsigned.apk instead. Keep
            # it for inspection, under a name nobody will mistake for a
            # download.
            cp "$built/app-release-unsigned.apk" "artifacts/PassVault-${GITHUB_REF_NAME#v}-UNSIGNED.apk"
          fi
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: passvault-android
          path: artifacts/*.apk
          if-no-files-found: error

  signaling:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -f apps/signaling/Dockerfile -t passvault-signaling:${{ github.sha }} .
      - name: Does it serve health?
        run: |
          docker run -d --name signaling -p 8787:8787 passvault-signaling:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then
              echo "healthy"; docker rm -f signaling; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; docker logs signaling; exit 1

  publish:
    # Only on a tag: a manual run is for checking the build, not for handing
    # anyone an installer.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, signaling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          # Without a signature a recipient has no way to tell a real download
          # from a corrupted or substituted one. A checksum is weaker than
          # signing — it only helps if they got the checksum from somewhere
          # they trust — but it is not nothing.
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Installing

          These builds are **not signed**, so both systems will warn that the
          app comes from an unidentified developer. That warning is accurate:
          nothing here has been vouched for by Apple or Microsoft. Only install
          this if you trust where you got it from.

          ### macOS

          Open the `.dmg` for your Mac and drag PassVault to Applications:

          - Apple Silicon (M1 and later) — `PassVault-*-arm64.dmg`
          - Intel — `PassVault-*-x64.dmg`

          The first launch is blocked. To allow it: **System Settings →
          Privacy & Security**, scroll to the note about PassVault being
          blocked, and press **Open Anyway**. Right-clicking the app and
          choosing Open no longer works on recent macOS.

          ### Windows

          Run `PassVault-*-setup.exe`. SmartScreen will say "Windows protected
          your PC" — **More info → Run anyway**.

          ### Android

          Download `PassVault-*.apk` on the phone and open it. Android will ask
          you to allow installing from your browser or files app the first
          time; this is the same warning every app that does not come from the
          Play Store produces.

          A file named `-UNSIGNED.apk` cannot be installed — it means the
          release was built without a signing key, and is there for inspection
          only.

          The phone keeps the vault as a file you choose, so KeePassDX or
          Keepass2Android can open the very same file PassVault syncs.

          ### Verifying the download

          `SHA256SUMS.txt` lists a checksum for every file. Compare it against
          your download, having got the checksum from somewhere other than the
          download itself:

          ```
          shasum -a 256 PassVault-0.1.0-arm64.dmg    # macOS
          certutil -hashfile PassVault-0.1.0-setup.exe SHA256    # Windows
          ```

          ### After installing

          Both devices need the same connection server. In the app:
          **Devices → Connection server**, enter the address, **Check it
          works**, **Save**. Then pair with the eight-character code.
          NOTES

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
          draft: true
          fail_on_unmatched_files: true
